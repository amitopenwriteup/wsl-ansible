- name: test
  hosts: all
  tasks:
    - name: Install a list of packages
      ansible.builtin.apt:
        name: apache2
        state: present
      when: ansible_facts['os_family'] == "Debian"
    - name: Install pacakge on redhat
      ansible.builtin.dnf:
        name: httpd
        state: present
      when: ansible_facts['os_family'] == "Redhat"
