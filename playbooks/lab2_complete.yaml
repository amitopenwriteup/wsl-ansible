- name: play1
  hosts: local
  become: true
  vars_files:
    - vars_complete.yml

  vars:
    environment_type: production

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install packages
      ansible.builtin.apt:
        name: "{{ item }}"
        state: "{{ state }}"
      loop: "{{ packages }}"

    - name: Start service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: started
        enabled: yes

    - name: Display variables
      ansible.builtin.debug:
        msg: |
          Environment: {{ environment_type }}
          Service: {{ service_name }}
          Port: {{ http_port }}
