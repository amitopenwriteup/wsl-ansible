---
- name: test
  hosts: all
  become: true
  tasks:
    - name: Ensure groups exist
      ansible.builtin.group:
        name: "{{ item.groups }}"
        state: present
      loop:
        - name: alice
          groups: sudo
        - name: bob
          groups: developers
        - name: testb
          groups: dev
        - name: bteob
          groups: qa
    - name: Create users
      ansible.builtin.user:
        name: "{{ item.name }}"
        groups: "{{ item.groups }}"
        state: present
      loop:
        - name: alice
          groups: sudo
        - name: bob
          groups: developers

