---
# Project: Install Docker on any host, RedHat or Debian family,
# using `when` (to branch on ansible_facts['os_family']) combined
# with `loop` (so each OS's package/prereq list is walked once
# instead of writing a separate task per package).
#
# Open with:
#   vi docker_setup.yaml
# Run with:
#   ansible-playbook -i inventory.ini docker_setup.yaml --ask-become-pass

- name: Install Docker based on OS family
  hosts: all
  become: true

  vars:
    # Same final package set on both families — one list, not two.
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

    # Prerequisite packages differ per OS family, so they're keyed
    # by ansible_facts['os_family'] and walked with a loop.
    docker_prereqs:
      RedHat:
        - dnf-plugins-core
      Debian:
        - apt-transport-https
        - ca-certificates
        - curl
        - gnupg
        - lsb-release

    docker_repo_url_redhat: https://download.docker.com/linux/centos/docker-ce.repo
    docker_repo_url_debian: https://download.docker.com/linux/ubuntu
    docker_repo_key_url_debian: https://download.docker.com/linux/ubuntu/gpg

  tasks:
    # --- when + loop: install each OS's prerequisite packages ---
    # `when` picks the right key out of docker_prereqs for this host's
    # OS family; `loop` then walks that OS's package list one at a time
    # (ansible.builtin.package auto-selects dnf/apt/yum under the hood,
    # so one task covers both families instead of two).
    - name: Install OS-specific prerequisites
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop: "{{ docker_prereqs[ansible_facts['os_family']] }}"
      when: ansible_facts['os_family'] in docker_prereqs

    - name: Add Docker CE repo on RedHat
      ansible.builtin.get_url:
        url: "{{ docker_repo_url_redhat }}"
        dest: /etc/yum.repos.d/docker-ce.repo
      when: ansible_facts['os_family'] == "RedHat"
      notify: Restart Docker

    - name: Add Docker GPG key on Debian
      ansible.builtin.apt_key:
        url: "{{ docker_repo_key_url_debian }}"
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Add Docker repository on Debian
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] {{ docker_repo_url_debian }} {{ ansible_facts['lsb']['codename'] }} stable"
        state: present
      when: ansible_facts['os_family'] == "Debian"
      notify: Restart Docker

    # --- loop again: install every package in the shared list ---
    # No when needed here — ansible.builtin.package already resolves
    # to the correct backend for whichever OS family the host is.
    - name: Install Docker packages
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop: "{{ docker_packages }}"
      notify: Restart Docker

    - name: Enable and start Docker service
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
